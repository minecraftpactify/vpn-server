# Configuration WireGuard - Serveur VPN
[Interface]
# Clé privée du serveur (sera générée au premier démarrage)
PrivateKey = SERVER_PRIVATE_KEY_PLACEHOLDER
Address = 10.0.0.1/24
# Redirige tout le trafic via le VPN
PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
ListenPort = 51820

# Client (ton PC)
[Peer]
PublicKey = CLIENT_PUBLIC_KEY_PLACEHOLDER
AllowedIPs = 10.0.0.2/32
